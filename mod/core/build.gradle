// The engine bridge is five C functions (contract/bsi_capi.h) bound with JNA
// direct mapping -- no JNI glue, no per-platform C file (D-044 §2).
//
// Minecraft 1.20.1 already ships net.java.dev.jna (oshi depends on it), so at
// runtime under Forge this is compileOnly: taking a second copy would put two
// JNA versions on one classpath, which is a class-loading fight nobody wins.
// The test runtime needs a real one, so it gets it there. If a future Forge
// drops JNA, D-044 falsification (3) says: jarJar it, or fall back to JNI.
ext.jnaVersion = '5.12.1'

dependencies {
    api project(':api')

    compileOnly "net.java.dev.jna:jna:${jnaVersion}"
    testImplementation "net.java.dev.jna:jna:${jnaVersion}"
}

// The contract hash and schema travel INSIDE the jar so BsiContract can compare
// them at handshake time. They are copied from contract/, never a second copy
// checked in: a copy drifts, and a drifting contract hash is exactly the failure
// the handshake exists to catch.
apply from: rootProject.file('../gradle/contract-resources.gradle')

// N23-a: the pin must match the bytes it pins, on every build, not only in CI.
def checkContract = tasks.register('checkContract', Exec) {
    description = 'contract/check_contract.py: the pinned hash matches the directory it pins'
    workingDir rootProject.file('..')
    commandLine 'python3', 'contract/check_contract.py'
    isIgnoreExitValue = false
}
tasks.named('check') { dependsOn checkContract }

// Gate-only counted native library; never a jar payload. No silent SKIP.
tasks.register('bsiRetryGate', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.blockreality.core.engine.BsiRetryGate'
    doFirst {
        def library = System.getProperty('br.retryEngine', '')
        def frames = System.getProperty('br.retryFrames', '')
        if (!new File(library).isFile() || !new File(frames, 'oracle.frame').isFile()) {
            throw new GradleException('bsiRetryGate requires absolute -Dbr.retryEngine=<counted native library> and -Dbr.retryFrames=<native frames directory>')
        }
        args library, frames
    }
}
