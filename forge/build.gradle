plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '0.3c'
group = 'com.blockreality'
base { archivesName = 'blockreality' }

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

// The pure-Java half is compiled from SOURCE, as extra source directories.
//
// The obvious alternative — a Gradle composite build with `includeBuild '../mod'` — was
// tried and dropped. Dependency substitution across a composite works for compilation but
// fights with ForgeGradle's reobf and with jarJar, which wants real published coordinates.
// That is a lot of moving parts to debug on the morning you want to look at a beam.
//
// Reading the sources directly means one build, one classpath, and a mod jar that contains
// everything by construction. The api/impl discipline is not weakened by this: it lives in
// `../mod`, where `gradle check` runs `checkApiPurity` against the same files.
sourceSets.main.java.srcDirs += [
        '../mod/api/src/main/java',
        '../mod/core/src/main/java',
]

minecraft {
    // Official Mojang mappings, matching the previous project's convention.
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Optional. The mod also finds the engine through the config file, the
            // BR_SIDECAR environment variable, the game directory, or PATH — see
            // SidecarLocator. Absent everywhere just means analysis is off.
            if (System.getenv('BR_SIDECAR')) {
                property 'br.sidecar', System.getenv('BR_SIDECAR')
            }
            mods { blockreality { source sourceSets.main } }
        }
        client { }
        server { }
        data {
            args '--mod', 'blockreality', '--all', '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Plain JUnit against the forge layer's MC-free logic (permission table, analysis
// loop state machines) plus packet codecs. The main compile classpath is appended so
// test sources can see the ForgeGradle-provided Minecraft artifact (FriendlyByteBuf
// for the packet round-trip tests); tests never start the game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}

// ---------------------------------------------------------------- bundled engine
//
// The analysis engine travels INSIDE the jar and unpacks itself on first use (D-027).
// On CurseForge and Modrinth a mod is one jar dropped into mods/; an engine the player
// has to fetch and place separately is not a distribution, and the installer scripts that
// made it bearable cannot run at all when the jar arrives through a launcher.
//
// Nothing is downloaded, here or at runtime. These are bytes that scripts/package.sh has
// already built and gated, copied in with their SHA-256 recorded beside them; the runtime
// refuses anything whose hash does not match (BundledEngine).
//
//   -PbrEngineDir=<dir>    where to take br-sidecar / br-sidecar.exe from
//   -PbrEngineDir=none     build a jar with no engine in it
//
// A jar built with no engine is a legitimate outcome, not a failure: it is the normal
// development flow, and the mod still finds an engine through sidecarPath, -Dbr.sidecar,
// BR_SIDECAR, the game directory or PATH. What must never happen is a jar that SAYS it
// carries an engine and does not, which is why the manifest is generated from the files
// actually copied rather than written ahead of them.
def brEngineDir = project.findProperty('brEngineDir') ?: '../dist'
def brEngineOut = layout.buildDirectory.dir('generated/engine').get().asFile

tasks.register('bundleEngines') {
    description = 'Copies the built engines into the jar, with a hash manifest.'
    group = 'build'
    def src = brEngineDir == 'none' ? null : file(brEngineDir)
    if (src != null) inputs.files(fileTree(src) { include 'br-sidecar', 'br-sidecar.exe' })
    outputs.dir(brEngineOut)
    doLast {
        // The WHOLE generated directory is cleared, not just the destination below. It
        // used to clear only its own subdirectory, and renaming that subdirectory left
        // the previous one behind — so the next jar shipped BOTH copies of both engines
        // and grew from 2.4 MB to 4.5 MB. This task owns brEngineOut (it declares it as
        // an output); anything in there that this run did not write does not belong in
        // the jar.
        brEngineOut.deleteDir()
        // Hyphenated so the directory can never be read as a JPMS package name —
        // see BundledEngine.DIR. Changing it here means changing it there.
        def dest = new File(brEngineOut, 'blockreality-engine')
        dest.mkdirs()
        def lines = []
        // (file name, os, arch). Only x86-64 binaries are built today; a platform with no
        // entry gets a clear "nothing shipped for you" at runtime rather than a binary for
        // the wrong architecture.
        [['br-sidecar.exe', 'windows', 'x86_64'], ['br-sidecar', 'linux', 'x86_64']].each { name, os, arch ->
            if (src == null) return
            def f = new File(src, name)
            if (!f.isFile()) return
            def md = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { ins ->
                byte[] buf = new byte[65536]
                int n
                while ((n = ins.read(buf)) > 0) md.update(buf, 0, n)
            }
            def hex = md.digest().collect { String.format('%02x', it) }.join('')
            new File(dest, name).bytes = f.bytes
            lines << "${os} ${arch} ${name} ${hex} ${f.length()}"
        }
        // Apache-2.0 4(a) and 4(d) are about the ARTEFACT, not the repository: a
        // recipient of the jar must get the licence and the NOTICE with it. Both files
        // existed at the repo root and neither was in the jar or the archive. The engine
        // statically links FrameCore (MIT) and Eigen (MPL-2.0), whose terms travel with
        // every copy of that binary, so their texts go too — MPL-2.0 3.2 also wants the
        // recipient told where the source is, which NOTICE now says.
        def meta = new File(brEngineOut, 'META-INF')
        meta.mkdirs()
        ['LICENSE', 'NOTICE'].each { n -> new File(meta, n).bytes = file("../${n}").bytes }
        def tp = new File(meta, 'third_party')
        tp.mkdirs()
        file('../third_party').listFiles()?.each { f -> new File(tp, f.name).bytes = f.bytes }

        if (lines.isEmpty()) {
            logger.lifecycle("bundleEngines: no engine found in ${src ?: 'none'} — " +
                    'building a jar without one (development build)')
        } else {
            new File(dest, 'engine.manifest').setText(
                    "# os arch file sha256 size\n" + lines.join('\n') + '\n', 'UTF-8')
            logger.lifecycle("bundleEngines: ${lines.size()} engine(s) from ${src}")
        }
    }
}

sourceSets.main.resources.srcDirs += brEngineOut
tasks.named('processResources') { dependsOn 'bundleEngines' }

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'   : 'Block Reality',
                'Specification-Vendor'  : 'blockreality',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'blockreality',
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
