plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '0.4.0-dev'
group = 'com.blockreality'
base { archivesName = 'blockreality' }

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

// The pure-Java half is compiled from SOURCE, as extra source directories.
//
// The obvious alternative — a Gradle composite build with `includeBuild '../mod'` — was
// tried and dropped. Dependency substitution across a composite works for compilation but
// fights with ForgeGradle's reobf and with jarJar, which wants real published coordinates.
// That is a lot of moving parts to debug on the morning you want to look at a beam.
//
// Reading the sources directly means one build, one classpath, and a mod jar that contains
// everything by construction. The api/impl discipline is not weakened by this: it lives in
// `../mod`, where `gradle check` runs `checkApiPurity` against the same files.
sourceSets.main.java.srcDirs += [
        '../mod/api/src/main/java',
        '../mod/core/src/main/java',
]
sourceSets.main.resources.srcDir '../mod/core/src/main/resources'

minecraft {
    // Official Mojang mappings, matching the previous project's convention.
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Development override; GameNativeLoader resolves the library lazily on a worker.
            if (System.getenv('BR_ENGINE')) {
                property 'br.engine', System.getenv('BR_ENGINE')
            }
            mods { blockreality { source sourceSets.main } }
        }
        client { }
        server { }
        data {
            args '--mod', 'blockreality', '--all', '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Plain JUnit against the forge layer's MC-free logic (permission table, analysis
// loop state machines) plus packet codecs. The main compile classpath is appended so
// test sources can see the ForgeGradle-provided Minecraft artifact (FriendlyByteBuf
// for the packet round-trip tests); tests never start the game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}

apply from: rootProject.file('../gradle/contract-resources.gradle')

// ---------------------------------------------------------------- bundled engine
//
// Only shared libraries enter the game jar (D-044, GAME_RUNTIME GR-6).
// -PbrNativesDir=<dir> consumes staged <os>-<arch>/<file> plus provenance.json.
// Default none makes a development jar; config/-Dbr.engine/BR_ENGINE may supply a library.
// Legacy scripts may still pass -PbrEngineDir=none. An executable directory is rejected.
if ((project.findProperty('brEngineDir') ?: 'none') != 'none') {
    throw new GradleException('GAME_RUNTIME: executable engine packaging is retired; use -PbrNativesDir or none')
}
def brNativesDir = project.findProperty('brNativesDir') ?: 'none'
def brEngineOut = layout.buildDirectory.dir('generated/engine').get().asFile

tasks.register('bundleEngines') {
    description = 'Copies staged native libraries into the jar with provenance and a hash manifest.'
    group = 'build'
    def natSrc = brNativesDir == 'none' ? null : file(brNativesDir)
    inputs.property('nativeStagingDirectory', brNativesDir)
    inputs.file(rootProject.file('../contract/CONTRACT_SHA256')).withPropertyName('contractPin')
    inputs.files(rootProject.file('../LICENSE'), rootProject.file('../NOTICE')).withPropertyName('distributionNotices')
    inputs.files(fileTree(rootProject.file('../third_party'))).withPropertyName('thirdPartyNotices')
    if (natSrc != null) inputs.files(fileTree(natSrc))
    outputs.dir(brEngineOut)
    doLast {
        // The WHOLE generated directory is cleared, not just the destination below. It
        // used to clear only its own subdirectory, and renaming that subdirectory left
        // the previous one behind — so the next jar shipped BOTH copies of both engines
        // and grew from 2.4 MB to 4.5 MB. This task owns brEngineOut (it declares it as
        // an output); anything in there that this run did not write does not belong in
        // the jar.
        brEngineOut.deleteDir()
        // Hyphenated so the directory can never be read as a JPMS package name —
        // see BundledEngine.DIR. Changing it here means changing it there.
        def dest = new File(brEngineOut, 'blockreality-engine')
        dest.mkdirs()
        // ---------------------------------------------------------------- the library shape
        //
        // Everything here is filled in from provenance.json, which scripts/stage_natives.py
        // wrote by LOADING each library and asking it `bsi.hello`. Nothing in this block
        // asserts a version or a contract hash on the engine's behalf; if the staging step
        // did not run, there is no provenance and the build stops rather than writing
        // "unknown" into a manifest a player's log will later quote back.
        def natLines = []
        if (natSrc != null) {
            def prov = new File(natSrc, 'provenance.json')
            if (!prov.isFile()) {
                throw new GradleException("-PbrNativesDir=${brNativesDir} has no provenance.json. " +
                        'Stage the libraries with scripts/stage_natives.py, which asks each one ' +
                        'for its version and contract instead of guessing them.')
            }
            def doc = new groovy.json.JsonSlurper().parse(prov)
            def pin = new File(project.projectDir, '../contract/CONTRACT_SHA256').text.trim().split()[0].toLowerCase()
            def platforms = new HashSet<String>()
            if (doc.contractSha256 != pin) throw new GradleException('provenance contract pin mismatch')
            doc.libraries.each { lib ->
                if (!(lib.os in ['windows', 'linux', 'macos']) || !(lib.arch in ['x86_64', 'aarch64']) ||
                        lib.platform != "${lib.os}-${lib.arch}" || !platforms.add(lib.platform) ||
                        !(lib.file ==~ /[A-Za-z0-9][A-Za-z0-9_.-]*/) ||
                        !(lib.sha256 ==~ /[0-9a-f]{64}/) || !(lib.engineVersion ==~ /\S+/)) {
                    throw new GradleException('invalid or duplicate native provenance entry')
                }
                def f = new File(new File(natSrc, lib.platform), lib.file)
                if (!f.isFile()) {
                    throw new GradleException("provenance.json lists ${lib.platform}/${lib.file}, " +
                            "which is not in ${natSrc}")
                }
                // Validate the exact bytes subsequently written; do not reopen the source
                // after hashing and leave a hash/copy race in the manifest's identity.
                byte[] nativeBytes = f.bytes
                def hex = java.security.MessageDigest.getInstance('SHA-256').digest(nativeBytes)
                        .collect { String.format('%02x', it) }.join('')
                // The provenance was written from a copy; this is the copy going into the
                // jar. They must be the same bytes, or the manifest describes a file the
                // player never receives.
                if (hex != lib.sha256 || nativeBytes.length != lib.size) {
                    throw new GradleException("${lib.platform}/${lib.file} is ${hex.take(12)}… " +
                            "but provenance.json recorded ${lib.sha256.take(12)}… — the staging " +
                            'directory changed under the build')
                }
                if (lib.contractSha256.toLowerCase() != pin) {
                    throw new GradleException("${lib.platform}/${lib.file} speaks contract " +
                            "${lib.contractSha256.take(12)}… and this repository pins ${pin.take(12)}…")
                }
                def pdir = new File(dest, lib.platform)
                pdir.mkdirs()
                new File(pdir, lib.file).bytes = nativeBytes
                natLines << "${lib.os} ${lib.arch} ${lib.file} ${hex} ${nativeBytes.length} ${lib.engineVersion} ${lib.contractSha256}"
            }
            if (natLines.isEmpty()) {
                throw new GradleException("-PbrNativesDir=${brNativesDir} was asked for and " +
                        'staged no library. An explicit request that produces nothing is a ' +
                        'failure, not a quiet development build; pass none to mean none.')
            }
        }

        // Apache-2.0 4(a) and 4(d) are about the ARTEFACT, not the repository: a
        // recipient of the jar must get the licence and the NOTICE with it. Both files
        // existed at the repo root and neither was in the jar or the archive. The engine
        // statically links FrameCore (MIT) and Eigen (MPL-2.0), whose terms travel with
        // every copy of that binary, so their texts go too — MPL-2.0 3.2 also wants the
        // recipient told where the source is, which NOTICE now says.
        def meta = new File(brEngineOut, 'META-INF')
        meta.mkdirs()
        ['LICENSE', 'NOTICE'].each { n -> new File(meta, n).bytes = file("../${n}").bytes }
        def tp = new File(meta, 'third_party')
        tp.mkdirs()
        file('../third_party').listFiles()?.each { f -> new File(tp, f.name).bytes = f.bytes }
        if (natSrc != null) {
            copy { from new File(natSrc, 'licenses'); into new File(tp, 'native-release') }
            def receipt = new File(meta, 'native-release')
            receipt.mkdirs()
            new File(receipt, 'provenance.json').bytes = new File(natSrc, 'provenance.json').bytes
            copy { from new File(natSrc, 'release'); into receipt }
        }

        if (!natLines.isEmpty()) {
            new File(dest, 'natives.manifest').setText(
                    "# os arch file sha256 size engineVersion contractSha256\n"
                            + natLines.join('\n') + '\n', 'UTF-8')
            logger.lifecycle("bundleEngines: ${natLines.size()} engine library/libraries from ${natSrc}")
        } else {
            logger.lifecycle('bundleEngines: no native library requested (development build)')
        }
    }
}

sourceSets.main.resources.srcDirs += brEngineOut
tasks.named('processResources') { dependsOn 'bundleEngines' }

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'   : 'Block Reality',
                'Specification-Vendor'  : 'blockreality',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'blockreality',
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Test-only compatibility fixtures; never part of main resources or the shipped jar.
sourceSets.test.java.srcDir "../mod/core/src/testFixtures/java"

// Inspect the actual reobfuscated artifact, including dormant bytecode references.
tasks.register('checkNativeOnlyJar', Exec) {
    dependsOn 'reobfJar'
    workingDir rootProject.file('..')
    doFirst {
        commandLine 'python3', 'scripts/check_native_only_jar.py',
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                '--mutation-checks', '--javac',
                javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
                        .get().executablePath.asFile.absolutePath
    }
}
tasks.named('check') { dependsOn 'checkNativeOnlyJar' }
