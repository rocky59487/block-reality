modLoader = "javafml"
loaderVersion = "[47,)"
license = "Apache-2.0"
logoFile = "blockreality_icon.png"
# The icon is pixel art. Forge smooths logos by default, which turns crisp block
# edges into mush at the size the mod list draws them.
logoBlur = false
issueTrackerURL = "https://github.com/rocky59487/block-reality/issues"

[[mods]]
modId = "blockreality"
version = "0.3b"
displayName = "Block Reality"
# Shown as the mod list's link. Point it at the project site once that is the page
# you want a curious player to land on; the repository is the honest default.
displayURL = "https://github.com/rocky59487/block-reality"
authors = "rocky59487"
description = '''
Structural analysis for Minecraft, solved by a real finite element engine.

Blocks placed in the world are extracted into beam members and solved by FrameCore in a
separate process. The stress glasses show the result: tension and compression across the
section depth, the neutral axis, and demand over capacity per member.

The analysis engine travels inside this jar and unpacks itself the first time it is
needed — there is nothing else to download or install. It runs as a separate process, so a
fault in the C++ costs one analysis rather than your server or your world. Nothing here
reaches the network.

No engine ships for macOS or for ARM yet. There the mod loads and plays normally with
analysis disabled, and says so.
'''

[[dependencies.blockreality]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,48)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.blockreality]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1]"
    ordering = "NONE"
    side = "BOTH"
