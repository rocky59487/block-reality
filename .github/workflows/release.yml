# Publishes dist/ as a downloadable release archive.
#
# The engine is not built here. br-sidecar links FrameCore, which is an external
# source dependency that this repository does not carry, so a hosted runner cannot
# reproduce it. dist/ holds the binaries that scripts/package.sh produced on a
# machine that does have it, and this workflow only packages and publishes them.
#
# Push a tag to publish:
#     git tag v0.1a && git push origin v0.1a
#
# Or run it by hand from the Actions tab.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.1a)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # A release whose contents do not match the hashes shipped beside them is
      # worse than no hashes at all, so the check gates publication.
      - name: Verify checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.txt

      # The tag names the release; dist/ provides its contents. Nothing else ties
      # the two together, so without this gate a workflow_dispatch with any tag
      # would happily publish an OLD binary under a NEW version (#48). The jar
      # filename, the version inside its mods.toml, and the evidence record must
      # all agree with the tag being published.
      - name: Version consistency (tag vs jar vs mods.toml vs evidence)
        run: |
          set -o pipefail
          v="${{ steps.v.outputs.version }}"
          test -f dist/br-sidecar.exe || { echo "::error::dist/br-sidecar.exe is missing"; exit 1; }
          jar=$(ls dist/blockreality-*.jar)
          [ "$(basename "$jar")" = "blockreality-${v}.jar" ] || {
            echo "::error::tag says ${v} but dist ships $(basename "$jar")"; exit 1; }
          unzip -p "$jar" META-INF/mods.toml | grep -Eq "^version *= *\"${v}\"" || {
            echo "::error::mods.toml inside the jar disagrees with tag ${v}:"
            unzip -p "$jar" META-INF/mods.toml | grep -E "^version" || true
            exit 1
          }
          python3 - <<'PY'
          import hashlib, json, sys
          doc = json.load(open("evidence/verification.json"))
          claimed = doc["identity"]["binary"]["sha256"]
          h = hashlib.sha256()
          with open("dist/br-sidecar", "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  h.update(chunk)
          actual = h.hexdigest()
          if claimed != actual:
              print(f"::error::evidence verified binary {claimed[:12]}... but dist "
                    f"ships {actual[:12]}... — the record is stale (#47)")
              sys.exit(1)
          eng = doc["identity"]["engine"]
          if eng["commit"] == "unavailable" or not eng["worktree_clean"]:
              print(f"::error::evidence has no engine provenance "
                    f"(commit={eng['commit']}, clean={eng['worktree_clean']}) (#47)")
              sys.exit(1)
          # Half the shipped engine is the Windows one, and until now nothing in this
          # chain looked at it: not its hash, not even whether it was there. A build cut
          # on a machine without mingw deleted it and published a Windows-less archive
          # with every gate green (PR26_REVIEW A-7).
          win = doc["identity"].get("binary_windows")
          if not win or not win.get("sha256"):
              print("::error::evidence has no identity.binary_windows — the record was "
                    "generated without the Windows engine")
              sys.exit(1)
          hw = hashlib.sha256()
          with open("dist/br-sidecar.exe", "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  hw.update(chunk)
          if win["sha256"] != hw.hexdigest():
              print(f"::error::evidence verified windows binary {win['sha256'][:12]}... "
                    f"but dist ships {hw.hexdigest()[:12]}...")
              sys.exit(1)
          print("evidence matches the shipped engines:", claimed[:12],
                win["sha256"][:12], eng["commit"][:12])
          PY

      - name: Build archive
        id: pack
        run: |
          name="blockreality-${{ steps.v.outputs.version }}.zip"
          chmod +x dist/br-sidecar dist/install.sh
          (cd dist && zip -q -r "../$name" . -x '*.zip')
          echo "archive=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Block Reality ${{ steps.v.outputs.version }}
          files: ${{ steps.pack.outputs.archive }}
          fail_on_unmatched_files: true
          body: |
            **Structural Preview** for Minecraft 1.20.1 + Forge 47.x: real finite
            element analysis on the blocks you place, from an engine running outside
            the game process.

            **What this preview does**
            - extracts placed blocks into 6-DOF beam members and MITC4 shell facets
              (floors and shear walls), one structure per connected component
            - solves them with self weight plus point test loads (`/br load`, in kN,
              any direction), off the tick thread, over a zero-copy shared-memory
              transport
            - reports per-member and per-plate demand/capacity with the governing
              fibre named, stress contours on the block faces, a section readout
              with the neutral axis, and a linear buckling factor — a slender column
              that "looks safe" on stress says so
            - nine structural blocks: three steel sections, plain concrete, timber,
              a brick pier, two slab thicknesses, 20 mm steel plate
            - every number is gated: 219 acceptance checks against closed forms and
              invariants per build, record in `evidence/VERIFICATION.md`

            **What it deliberately does not do yet**
            - no fracture, collapse or falling-block consequences — analysis reports;
              nothing breaks or falls
            - no construction sequencing, no reinforced-concrete composite sections
              (the concrete beam is honestly plain), no load combinations or wind
            - linear elastic only; the buckling factor is the linear onset, an upper
              bound on the real critical load

            **Install**: download `${{ steps.pack.outputs.archive }}`, extract, then
            run `install.bat` on Windows or `./install.sh` on Linux. The installer
            finds your Minecraft instance and copies the mod and the engine in.
            macOS: the mod installs and plays, but no macOS engine binary ships yet —
            analysis stays off unless you build `br-sidecar` from source.

            Contents: the mod jar, the analysis engine for Windows and Linux x86-64,
            the installers, and instructions in `START-HERE.txt` and `讀我-中文.txt`.
            `SHA256SUMS.txt` lists the hash of every file.
