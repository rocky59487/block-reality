# Publishes dist/ as a downloadable release archive.
#
# The engine is not built here. br-sidecar links FrameCore, which is an external
# source dependency that this repository does not carry, so a hosted runner cannot
# reproduce it. dist/ holds the binaries that scripts/package.sh produced on a
# machine that does have it, and this workflow only packages and publishes them.
#
# Push a tag to publish:
#     git tag v0.1a && git push origin v0.1a
#
# Or run it by hand from the Actions tab.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.1a)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishing is now downstream of the suite rather than beside it. release.yml runs
      # no tests of its own and had no link to the one that does: a tag pushed from a side
      # branch — with mods.toml, the jar name, SHA256SUMS and verification.json all moved
      # to the new version, which one package.sh run produces — passed every gate here
      # while ci.yml never ran at all, and Main's branch protection was nowhere on that
      # path. workflow_dispatch was shorter still: the publish action creates the tag for
      # you (V03A_REVIEW 1-6).
      - name: The suite must be green on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # ci.yml now runs on tag pushes too, so it is usually still going when this
          # starts. Wait for both required checks to CONCLUDE, then insist they concluded
          # green. A timeout is a refusal, not a pass — "we could not tell" and "it was
          # fine" must never be the same outcome.
          deadline=$(( $(date +%s) + 1500 ))
          while :; do
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --paginate --jq '.check_runs[] | [.name, (.conclusion // "pending")] | @tsv' > runs.tsv
            pending=0
            fail=0
            for name in "engine acceptance suite vs shipped binary" \
                        "Java suites, cross-language against the shipped engine"; do
              got=$(awk -F'\t' -v n="$name" '$1 == n { print $2; exit }' runs.tsv)
              case "${got:-missing}" in
                success) ;;
                pending|missing) pending=1 ;;
                *) echo "::error::'$name' concluded '$got' on ${{ github.sha }}"; fail=1 ;;
              esac
            done
            [ "$fail" = 1 ] && exit 1
            [ "$pending" = 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the required checks did not conclude within 25 minutes"
              cat runs.tsv
              exit 1
            fi
            echo "waiting for the suite..."
            sleep 20
          done
          cat runs.tsv

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # A release whose contents do not match the hashes shipped beside them is
      # worse than no hashes at all, so the check gates publication.
      - name: Verify checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.txt

      # The tag names the release; dist/ provides its contents. Nothing else ties
      # the two together, so without this gate a workflow_dispatch with any tag
      # would happily publish an OLD binary under a NEW version (#48). The jar
      # filename, the version inside its mods.toml, and the evidence record must
      # all agree with the tag being published.
      - name: Version consistency (tag vs jar vs mods.toml vs evidence)
        run: |
          set -o pipefail
          v="${{ steps.v.outputs.version }}"
          test -f dist/br-sidecar.exe || { echo "::error::dist/br-sidecar.exe is missing"; exit 1; }
          jar=$(ls dist/blockreality-*.jar)
          [ "$(basename "$jar")" = "blockreality-${v}.jar" ] || {
            echo "::error::tag says ${v} but dist ships $(basename "$jar")"; exit 1; }
          unzip -p "$jar" META-INF/mods.toml | grep -Eq "^version *= *\"${v}\"" || {
            echo "::error::mods.toml inside the jar disagrees with tag ${v}:"
            unzip -p "$jar" META-INF/mods.toml | grep -E "^version" || true
            exit 1
          }
          python3 - <<'PY'
          import hashlib, json, sys
          doc = json.load(open("evidence/verification.json"))
          claimed = doc["identity"]["binary"]["sha256"]
          h = hashlib.sha256()
          with open("dist/br-sidecar", "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  h.update(chunk)
          actual = h.hexdigest()
          if claimed != actual:
              print(f"::error::evidence verified binary {claimed[:12]}... but dist "
                    f"ships {actual[:12]}... — the record is stale (#47)")
              sys.exit(1)
          eng = doc["identity"]["engine"]
          if eng["commit"] == "unavailable" or not eng["worktree_clean"]:
              print(f"::error::evidence has no engine provenance "
                    f"(commit={eng['commit']}, clean={eng['worktree_clean']}) (#47)")
              sys.exit(1)
          # Half the shipped engine is the Windows one, and until now nothing in this
          # chain looked at it: not its hash, not even whether it was there. A build cut
          # on a machine without mingw deleted it and published a Windows-less archive
          # with every gate green (PR26_REVIEW A-7).
          win = doc["identity"].get("binary_windows")
          if not win or not win.get("sha256"):
              print("::error::evidence has no identity.binary_windows — the record was "
                    "generated without the Windows engine")
              sys.exit(1)
          hw = hashlib.sha256()
          with open("dist/br-sidecar.exe", "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  hw.update(chunk)
          if win["sha256"] != hw.hexdigest():
              print(f"::error::evidence verified windows binary {win['sha256'][:12]}... "
                    f"but dist ships {hw.hexdigest()[:12]}...")
              sys.exit(1)
          print("evidence matches the shipped engines:", claimed[:12],
                win["sha256"][:12], eng["commit"][:12])
          PY

      # The jar a player installs from CurseForge or Modrinth IS the release, so the
      # engines inside it are gated here too, not only in CI (D-027).
      - name: the jar carries the engines the evidence verified
        run: python3 scripts/check_bundle.py dist

      - name: Build archive
        id: pack
        run: |
          name="blockreality-${{ steps.v.outputs.version }}.zip"
          chmod +x dist/br-sidecar dist/install.sh
          (cd dist && zip -q -r "../$name" . -x '*.zip')
          echo "archive=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Block Reality ${{ steps.v.outputs.version }}
          files: ${{ steps.pack.outputs.archive }}
          fail_on_unmatched_files: true
          body: |
            **Structural Preview** for Minecraft 1.20.1 + Forge 47.x: real finite
            element analysis on the blocks you place, from an engine running outside
            the game process.

            **What this preview does**
            - extracts placed blocks into 6-DOF beam members and MITC4 shell facets
              (floors and shear walls), one structure per connected component
            - solves them with self weight plus point test loads (`/br load`, in kN,
              any direction), off the tick thread, over a zero-copy shared-memory
              transport
            - reports per-member and per-plate demand/capacity with the governing
              fibre named, stress contours on the block faces, a section readout
              with the neutral axis, and a linear buckling factor — a slender column
              that "looks safe" on stress says so
            - nine structural blocks: three steel sections, plain concrete, timber,
              a brick pier, two slab thicknesses, 20 mm steel plate — and they mix:
              a timber beam on brick piers is one structure, joined where the blocks
              touch, not three that ignore each other
            - 330 acceptance checks against closed forms and invariants run per build,
              record in `evidence/VERIFICATION.md`. Not *every* number: the shear and
              torsion demand/capacity modes still have no oracle and are documented as
              ungated in `docs/GATES.md`
            - one jar to install: the engine travels inside it and unpacks itself,
              verified against a hash recorded beside it, with no network access at any
              point

            **Commands that change something** — `/br load`, `/br unload`, `/br scan`,
            `/br resolve` and `/br reset` — need operator level 2, which a single-player
            creative world has by default. The Stress Glasses need no permission: they
            apply one configured downward test load. Reading commands (`/br status`,
            `members`, `section`, `loads`) are open to everyone.

            **What it deliberately does not do yet**
            - no fracture, collapse or falling-block consequences — analysis reports;
              nothing breaks or falls
            - no construction sequencing, no reinforced-concrete composite sections
              (the concrete beam is honestly plain), no load combinations or wind
            - linear elastic only; the buckling factor is the linear onset, an upper
              bound on the real critical load

            **Install**: put `blockreality-${{ steps.v.outputs.version }}.jar` in your
            `mods/` folder and launch the game. That is the whole procedure — the analysis
            engine is inside the jar and unpacks itself on first use, to
            `<game directory>/blockreality/engine/<hash>/`. **Nothing is downloaded**: the
            bytes were already in the jar, their SHA-256 is recorded beside them, and
            anything that does not match is refused rather than run. A binary you put
            there yourself is never touched. Windows and Linux x86-64; on macOS or ARM the
            mod plays normally with analysis disabled and says so.

            The archive also carries both engines loose, with `SHA256SUMS.txt`, optional
            installer scripts, and instructions in `START-HERE.txt` and `讀我-中文.txt`.
            The loose binaries are byte-identical to the ones inside the jar and a build
            gate holds them to that. The build pins the one field that made it
            non-deterministic (the PE link timestamp), so two clean builds on the same
            toolchain give identical hashes — which is not the same as you being able to
            reproduce them, because the engine links FrameCore and this repository does
            not carry it.
